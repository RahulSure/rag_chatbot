# nginx reverse proxy for the Shrimali AI platform (single VM).
#
# Puts the whole app on port 80 (443 after certbot):
#   /        -> Next.js web container (127.0.0.1:3000)
#   /api/*   -> FastAPI api container (127.0.0.1:8000), with the /api prefix
#              stripped, so the browser calls same-origin /api/query etc.
#
# Install:  copy to /etc/nginx/sites-available/shrimali.conf,
#           ln -s to /etc/nginx/sites-enabled/, remove the default site,
#           nginx -t && systemctl reload nginx
#
# After pointing a domain at the droplet, get TLS with:
#   certbot --nginx -d your-domain.com

server {
    listen 80;
    listen [::]:80;
    server_name _;               # replace _ with your domain once you have one

    # Allow large PDF uploads via /admin/upload
    client_max_body_size 50m;

    # ── API (prefix stripped by the trailing slash on proxy_pass) ────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: the chat streams tokens — never buffer these.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── Frontend ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;   # Next.js HMR / websockets
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
