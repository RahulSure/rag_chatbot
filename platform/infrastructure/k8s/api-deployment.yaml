apiVersion: apps/v1
kind: Deployment
metadata:
  name: shrimali-api
  namespace: shrimali
  labels:
    app: shrimali-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shrimali-api
  template:
    metadata:
      labels:
        app: shrimali-api
    spec:
      containers:
        - name: api
          image: shrimali/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: shrimali-secrets
          env:
            - name: REDIS_URL
              value: "redis://shrimali-redis:6379"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: shrimali-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: shrimali-api
  namespace: shrimali
spec:
  selector:
    app: shrimali-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
