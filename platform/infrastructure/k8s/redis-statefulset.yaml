apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shrimali-redis
  namespace: shrimali
spec:
  serviceName: shrimali-redis
  replicas: 1
  selector:
    matchLabels:
      app: shrimali-redis
  template:
    metadata:
      labels:
        app: shrimali-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "512mb"
            - --maxmemory-policy
            - allkeys-lru
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "600Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: shrimali-redis
  namespace: shrimali
spec:
  selector:
    app: shrimali-redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None
