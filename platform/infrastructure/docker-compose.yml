version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: platform/infrastructure/docker/api.Dockerfile
    container_name: shrimali-api
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ../../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Next.js Frontend ─────────────────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: ../../infrastructure/docker/web.Dockerfile
    container_name: shrimali-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    depends_on:
      - api
    restart: unless-stopped

  # ── Celery Worker (Article Generation) ───────────────────────────────────
  worker:
    build:
      context: ../..
      dockerfile: platform/infrastructure/docker/worker.Dockerfile
    container_name: shrimali-worker
    env_file:
      - ../../.env
    environment:
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ../../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A platform.services.worker.celery_app worker --loglevel=info --concurrency=2

  # ── Celery Beat (Cron Scheduler) ──────────────────────────────────────────
  beat:
    build:
      context: ../..
      dockerfile: platform/infrastructure/docker/worker.Dockerfile
    container_name: shrimali-beat
    env_file:
      - ../../.env
    environment:
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A platform.services.worker.celery_app beat --loglevel=info

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shrimali-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: shrimali-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    profiles: ["monitoring"]

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: shrimali-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=shrimali_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    profiles: ["monitoring"]

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
