worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;                 # don't leak nginx version

    # Allow large uploads (admin PDF ingest) and long-lived streaming responses.
    client_max_body_size 50m;

    # Gzip static assets served through the proxy.
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    upstream web {
        server web:3000;
    }

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # ── Locked-down backend surface ──────────────────────────────────────
        # The API container is never published (compose uses `expose`, not
        # `ports`), so the ONLY way in from outside is through this nginx. These
        # blocks make the sensitive endpoints unreachable from the public edge —
        # defense in depth on top of the app's ADMIN_SECRET check.
        #
        #   /api/admin/*  → admin upload / ingest / delete   (blocked)
        #   /api/metrics  → Prometheus internal metrics       (blocked)
        #   /api/api/*    → FastAPI Swagger/OpenAPI docs       (blocked)
        # If you ever need these, reach them from the host over the Docker
        # network, or add an IP allowlist / auth here.
        location ^~ /api/admin { return 404; }
        location = /api/metrics { return 404; }
        location ^~ /api/api/   { return 404; }

        # ── Public backend endpoints (used by the browser) ───────────────────
        # Browser hits same-origin /api/* → nginx strips the prefix and forwards
        # to the API. The trailing slash on proxy_pass does the prefix strip:
        #   /api/query  →  http://api:8000/query
        location /api/ {
            proxy_pass http://api/;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-Sent Events / token streaming from /query — never buffer.
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
        }

        # ── Frontend (Next.js) ───────────────────────────────────────────────
        location / {
            proxy_pass http://web;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Modest hardening headers on user-facing responses.
            add_header X-Content-Type-Options "nosniff"        always;
            add_header X-Frame-Options        "SAMEORIGIN"     always;
            add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

            # Next.js HMR / websocket upgrade support.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 90s;
        }
    }
}
